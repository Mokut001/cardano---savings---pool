<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardano Vault Pro</title>
    <script src="https://unpkg.com/lucid-cardano/dist/lucid.bundle.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold text-sky-400 mb-2 text-center">Cardano Vault</h1>
        <p id="status" class="text-xs text-center text-slate-400 mb-6 uppercase tracking-widest italic">Connecting...</p>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700">
                <p class="text-[10px] text-slate-500 uppercase">Your Wallet</p>
                <p id="wallet-addr" class="text-xs font-mono truncate text-sky-200 mt-1">Not Connected</p>
            </div>
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700">
                <p class="text-[10px] text-slate-500 uppercase">Vault Balance</p>
                <p id="vault-bal" class="text-sm font-bold text-emerald-400 mt-1">0.00 ADA</p>
            </div>
        </div>

        <input type="number" id="amt" placeholder="Amount (ADA)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 mb-4 text-white focus:outline-none focus:border-sky-500">
        
        <button onclick="deposit()" class="w-full bg-sky-500 hover:bg-sky-600 text-slate-900 font-bold py-4 rounded-xl transition-all mb-3 shadow-lg shadow-sky-500/20">
            DEPOSIT FUNDS
        </button>
        
        <button onclick="withdraw()" class="w-full bg-transparent border border-slate-600 hover:border-sky-500 text-slate-400 hover:text-sky-400 font-semibold py-3 rounded-xl transition-all">
            WITHDRAW ALL
        </button>

        <p class="text-[10px] text-slate-600 text-center mt-6">Securely locked via Plutus V2 Smart Contract</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
